name: constellation

x-provision-env-file: &provision-env-file
  - path: ${CONSTELLATION_ENV_FILE:-.env}
    required: true

# Container hardening for all services (finding R14 of the PR review). A service that needs a
# capability adds it with cap_add. Do not add resource limits here.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    <<: *hardened
    image: postgres:18.7-alpine
    restart: unless-stopped
    # The entrypoint rejects a weak admin password. Then it calls the image entrypoint.
    entrypoint: ["sh", "/provision/postgres-entrypoint.sh"]
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    # The image entrypoint changes the owner of the data folder and starts PostgreSQL
    # as the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./provision:/provision:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - services

  valkey:
    <<: *hardened
    image: valkey/valkey:9.0.7-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/provision/valkey-entrypoint.sh"]
    command:
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --aclfile
      - /data/acl/users.acl
    # The image entrypoint changes the owner of /data and starts valkey-server
    # as the valkey user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      VALKEY_ADMIN_PASSWORD: ${VALKEY_ADMIN_PASSWORD:?Set VALKEY_ADMIN_PASSWORD in the env file}
    volumes:
      - valkey-data:/data
      - ./provision:/provision:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_ADMIN_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - services

  provision-postgres:
    <<: *hardened
    image: postgres:18.7-alpine
    restart: "no"
    entrypoint: ["sh", "/provision/postgres.sh"]
    env_file: *provision-env-file
    volumes:
      - ./provision:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - services

  provision-valkey:
    <<: *hardened
    image: valkey/valkey:9.0.7-alpine
    restart: "no"
    entrypoint: ["sh", "/provision/valkey.sh"]
    env_file: *provision-env-file
    volumes:
      - ./provision:/provision:ro
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - services

  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - services
      - observability

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-otlp-receiver
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - observability

  loki:
    <<: *hardened
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - observability

  tempo:
    <<: *hardened
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-72h}
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  grafana:
    <<: *hardened
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    # The entrypoint rejects a weak admin password or secret key. Then it calls /run.sh.
    entrypoint: ["sh", "/provision/grafana-entrypoint.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY in the env file}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./provision:/provision:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - observability

  identity:
    <<: *hardened
    image: ghcr.io/techorionai/constellation-identity:0.7.1
    restart: unless-stopped
    read_only: true
    depends_on:
      provision-postgres:
        condition: service_completed_successfully
      provision-valkey:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:?Set IDENTITY_ISSUER in the env file}
      IDENTITY_CLIENTS_FILE: /etc/identity/clients.yaml
      IDENTITY_SECRETS__MASTER_KEY_FILE: /run/secrets/identity_master_key
      IDENTITY_SECRETS__MASTER_KEY_ID: ${IDENTITY_MASTER_KEY_ID:?Set IDENTITY_MASTER_KEY_ID in the env file}
      IDENTITY_DATABASE__URL: postgres://identity:${IDENTITY_DB_PASSWORD_URLENCODED:?Set IDENTITY_DB_PASSWORD_URLENCODED}@postgres:5432/identity?sslmode=disable
      IDENTITY_DATABASE__NAME: identity
      IDENTITY_VALKEY__ADDRESS: valkey:6379
      IDENTITY_VALKEY__USERNAME: identity
      IDENTITY_VALKEY__PASSWORD: ${IDENTITY_VALKEY_PASSWORD:?Set IDENTITY_VALKEY_PASSWORD in the env file}
      IDENTITY_VALKEY__KEY_PREFIX: identity
      # CIDR list of the reverse proxies in front of identity. Empty means no proxy.
      IDENTITY_HTTP__TRUSTED_PROXIES: ${IDENTITY_TRUSTED_PROXIES:-}
      # Upstream login. Empty client IDs turn the providers off. The client secrets are in the
      # identity database (see docs/compose.md), not here.
      IDENTITY_IDP__GOOGLE__CLIENT_ID: ${IDENTITY_GOOGLE_CLIENT_ID:-}
      IDENTITY_IDP__GOOGLE__ALLOWED_DOMAINS: ${IDENTITY_GOOGLE_ALLOWED_DOMAINS:-}
      IDENTITY_IDP__MICROSOFT__CLIENT_ID: ${IDENTITY_MICROSOFT_CLIENT_ID:-}
      IDENTITY_IDP__MICROSOFT__TENANT: ${IDENTITY_MICROSOFT_TENANT:-organizations}
      # The name that the browser shows when a user registers a passkey.
      IDENTITY_WEBAUTHN__RP_NAME: ${IDENTITY_WEBAUTHN_RP_NAME:-Constellation}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - identity_master_key
    volumes:
      # The long syntax does not make a directory at a missing host path (see docs/compose.md).
      - type: bind
        source: ${IDENTITY_CLIENTS_PATH:-./secrets/identity-clients.yaml}
        target: /etc/identity/clients.yaml
        read_only: true
        bind:
          create_host_path: false
    # Only the public port. The admin port 9090 stays unpublished.
    ports:
      - "${IDENTITY_BIND:-127.0.0.1}:${IDENTITY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/identity", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - services

  events:
    <<: *hardened
    image: ghcr.io/techorionai/constellation-events:0.1.0
    restart: unless-stopped
    read_only: true
    depends_on:
      provision-postgres:
        condition: service_completed_successfully
      provision-valkey:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      identity:
        condition: service_healthy
    environment:
      EVENTS_DATABASE__URL: postgres://events:${EVENTS_DB_PASSWORD_URLENCODED:?Set EVENTS_DB_PASSWORD_URLENCODED}@postgres:5432/events?sslmode=disable
      EVENTS_DATABASE__NAME: events
      EVENTS_VALKEY__ADDRESS: valkey:6379
      EVENTS_VALKEY__USERNAME: events
      EVENTS_VALKEY__PASSWORD: ${EVENTS_VALKEY_PASSWORD:?Set EVENTS_VALKEY_PASSWORD in the env file}
      EVENTS_VALKEY__KEY_PREFIX: events
      # The service client of the events service. The private key is the Compose secret
      # events_client_key. The key ID and the key path are not secrets.
      EVENTS_CLIENT__ID: events
      EVENTS_CLIENT__KEY_ID: ${EVENTS_CLIENT_KEY_ID:?Set EVENTS_CLIENT_KEY_ID in the env file}
      EVENTS_CLIENT__PRIVATE_KEY_FILE: /run/secrets/events_client_key
      EVENTS_CLIENT__ISSUER: ${IDENTITY_ISSUER:?Set IDENTITY_ISSUER in the env file}
      EVENTS_CLIENT__TOKEN_URL: http://identity:8080/oauth/token
      # The services talk to identity on the internal network with HTTP.
      EVENTS_CLIENT__ALLOW_INSECURE_HTTP: "true"
      EVENTS_IDENTITY__URL: http://identity:8080
      EVENTS_IDENTITY__ALLOW_INSECURE_HTTP: "true"
      EVENTS_AUTH__ISSUER: ${IDENTITY_ISSUER:?Set IDENTITY_ISSUER in the env file}
      EVENTS_AUTH__JWKS_URL: http://identity:8080/.well-known/jwks.json
      EVENTS_AUTH__ALLOW_INSECURE_HTTP: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - events_client_key
    # No published port. Only services on the network "services" call the events service.
    # The admin port 9090 stays unpublished.
    healthcheck:
      test: ["CMD", "/events", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - services

  audit:
    <<: *hardened
    image: ghcr.io/techorionai/constellation-audit:0.1.0
    restart: unless-stopped
    read_only: true
    depends_on:
      provision-postgres:
        condition: service_completed_successfully
      provision-valkey:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      identity:
        condition: service_healthy
    environment:
      AUDIT_DATABASE__URL: postgres://audit:${AUDIT_DB_PASSWORD_URLENCODED:?Set AUDIT_DB_PASSWORD_URLENCODED}@postgres:5432/audit?sslmode=disable
      AUDIT_DATABASE__NAME: audit
      # The pool rule is MaxConns >= 4 + 2 x AUDIT_EXPORT__CONCURRENCY. The default
      # concurrency is 2, so 8 is the minimum (see docs/compose.md).
      AUDIT_DATABASE__MAX_CONNS: "8"
      AUDIT_VALKEY__ADDRESS: valkey:6379
      AUDIT_VALKEY__USERNAME: audit
      AUDIT_VALKEY__PASSWORD: ${AUDIT_VALKEY_PASSWORD:?Set AUDIT_VALKEY_PASSWORD in the env file}
      AUDIT_VALKEY__KEY_PREFIX: audit
      # The service client of the audit service. The private key is the Compose secret
      # audit_client_key. The key ID and the key path are not secrets.
      AUDIT_CLIENT__ID: audit
      AUDIT_CLIENT__KEY_ID: ${AUDIT_CLIENT_KEY_ID:?Set AUDIT_CLIENT_KEY_ID in the env file}
      AUDIT_CLIENT__PRIVATE_KEY_FILE: /run/secrets/audit_client_key
      AUDIT_CLIENT__ISSUER: ${IDENTITY_ISSUER:?Set IDENTITY_ISSUER in the env file}
      AUDIT_CLIENT__TOKEN_URL: http://identity:8080/oauth/token
      # The services talk to identity on the internal network with HTTP.
      AUDIT_CLIENT__ALLOW_INSECURE_HTTP: "true"
      AUDIT_IDENTITY__URL: http://identity:8080
      AUDIT_IDENTITY__ALLOW_INSECURE_HTTP: "true"
      AUDIT_AUTH__ISSUER: ${IDENTITY_ISSUER:?Set IDENTITY_ISSUER in the env file}
      AUDIT_AUTH__JWKS_URL: http://identity:8080/.well-known/jwks.json
      AUDIT_AUTH__ALLOW_INSECURE_HTTP: "true"
      # AUDIT_HTTP__TRUSTED_PROXIES stays empty. The service has no proxy and no published port.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - audit_client_key
    # No published port. Only services on the network "services" call the audit service.
    # The admin port 9090 stays unpublished.
    healthcheck:
      test: ["CMD", "/audit", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - services

# Two networks (finding R4 of the PR review). Only the collector is on both.
# A business service joins "services". It cannot reach Loki, Tempo, or Prometheus.
networks:
  services:
  observability:

# The master key file of identity and the client keys of the events and audit services. A file keeps its
# owner and mode (see docs/compose.md).
secrets:
  identity_master_key:
    file: ${IDENTITY_MASTER_KEY_FILE:?Set IDENTITY_MASTER_KEY_FILE in the env file}
  events_client_key:
    file: ${EVENTS_CLIENT_KEY_FILE:?Set EVENTS_CLIENT_KEY_FILE in the env file}
  audit_client_key:
    file: ${AUDIT_CLIENT_KEY_FILE:?Set AUDIT_CLIENT_KEY_FILE in the env file}

volumes:
  postgres-data:
  valkey-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
